<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- CẤU HÌNH ICON VÀ TÊN APP CHO IPHONE (BẮT BUỘC) -->
    <meta name="apple-mobile-web-app-title" content="YLAG Chinese">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="image.png">
    <link rel="icon" type="image/png" href="image.png">
    
    <title>YLAG Chinese</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <title>YLAG Chinese - Học Từ Vựng</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f6f8;
            min-height: 100vh;
        }
        
        /* CSS Logo App & Avatar */
        .app-brand {
            font-size: 22px;
            font-weight: 900;
            color: #2b3a55;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .app-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        header .nav-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
        }

        .search-container { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ced4da; font-size: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .action-icon { color: #6c757d; border: none; background: none; cursor: pointer; font-size: 16px; padding: 5px; }
        .action-icon:hover { color: #2c3e50; }
        .action-icon.delete:hover { color: #ea4335; }
        .action-icon.edit:hover { color: #17a2b8; }
        
        .pos-badge {
            background-color: #e9ecef;
            color: #495057;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: center;">
        <div class="nav-container">
            <div class="app-brand">
                <!-- Chèn Avatar cá nhân ở đây -->
                <img src="image.png" alt="Avatar" class="app-avatar">
                YLAG CHINESE
            </div>
            <button class="nav-btn active" onclick="switchTab('list')"><i class="fas fa-list"></i> Danh sách</button>
            <button class="nav-btn" onclick="switchTab('add')"><i class="fas fa-plus"></i> Thêm từ</button>
            <button class="nav-btn" onclick="switchTab('review')"><i class="fas fa-gamepad"></i> Ôn tập</button>
            <button class="nav-btn" onclick="switchTab('mastered')"><i class="fas fa-archive"></i> Đã ẩn</button>
            <button class="nav-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main>
        <section id="tab-list" class="tab-content active">
            <div class="search-container">
                <input type="text" id="search-list" class="search-input" oninput="filterList('list')" placeholder="🔍 Tìm kiếm chữ Hán, pinyin hoặc nghĩa...">
            </div>
            <div id="flashcard-grid" class="grid-container"></div>
        </section>

        <section id="tab-add" class="tab-content">
            <form id="add-word-form" class="form-container">
                <h2>Thêm Từ Mới</h2>
                <div class="input-group">
                    <label>Chữ Hán (Hanzi):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="input-hanzi" required placeholder="Nhập chữ Hán vào đây..." lang="zh-CN">
                        <button type="button" onclick="autoFill()" style="padding: 10px 15px; background-color: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: bold;">
                            <i class="fas fa-magic"></i> Điền tự động
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Phiên âm (Pinyin):</label>
                    <input type="text" id="input-pinyin" required placeholder="Sẽ tự động điền">
                </div>
                
                <div class="input-group">
                    <label>Từ loại (Part of Speech):</label>
                    <input type="text" id="input-type" list="pos-options" required placeholder="Danh từ, Động từ, Tính từ...">
                    <datalist id="pos-options">
                        <option value="Noun (Danh từ)">
                        <option value="Verb (Động từ)">
                        <option value="Adj (Tính từ)">
                        <option value="Adv (Trạng từ)">
                        <option value="Pronoun (Đại từ)">
                        <option value="Measure (Lượng từ)">
                    </datalist>
                </div>

                <div class="input-group">
                    <label>English Definition:</label>
                    <textarea id="input-en" placeholder="Nghĩa tiếng Anh tự động..." lang="en"></textarea>
                </div>
                <div class="input-group">
                    <label>Nghĩa tiếng Việt:</label>
                    <textarea id="input-vi" required placeholder="Nghĩa tiếng Việt tự động..." lang="vi"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Lưu từ mới</button>
            </form>
            
            <div class="form-container" style="margin-top: 25px; text-align: center; border: 2px dashed #ced4da;">
                <h3 style="margin-bottom: 10px; color: #495057;">Quản lý Dữ liệu JSON</h3>
                <div style="display: flex; justify-content: center; gap: 15px;">
                    <button onclick="exportJSON()" class="btn-success" style="padding: 10px 20px;"><i class="fas fa-download"></i> Xuất JSON</button>
                    <label class="btn-primary" style="padding: 10px 20px; cursor: pointer;">
                        <i class="fas fa-upload"></i> Nhập JSON
                        <input type="file" accept=".json" style="display: none;" onchange="importJSON(event)">
                    </label>
                </div>
            </div>
        </section>

        <section id="tab-review" class="tab-content">
            <div id="review-container" class="review-card">
                <div class="empty-state">Nhấn "Bắt đầu ôn tập" để kiểm tra từ vựng.</div>
            </div>
            
            <div id="default-controls" class="review-controls">
                <button onclick="startReview()" class="btn-primary">Bắt đầu ôn tập</button>
            </div>

            <div id="srs-controls" class="srs-buttons" style="display: none;">
                <button class="btn-srs btn-srs-1" onclick="updateSRS(1)">
                    <span class="key-hint">Phím 1</span><span class="label">Lại</span><span class="time">30 phút</span>
                </button>
                <button class="btn-srs btn-srs-2" onclick="updateSRS(2)">
                    <span class="key-hint">Phím 2</span><span class="label">Khó</span><span class="time">1-2 ngày</span>
                </button>
                <button class="btn-srs btn-srs-3" onclick="updateSRS(3)">
                    <span class="key-hint">Phím 3</span><span class="label">Tốt</span><span class="time">3-5 ngày</span>
                </button>
                <button class="btn-srs btn-srs-4" onclick="updateSRS(4)">
                    <span class="key-hint">Phím 4</span><span class="label">Dễ</span><span class="time">5-7 ngày</span>
                </button>
                <button class="btn-srs btn-srs-5" onclick="updateSRS(5)">
                    <span class="key-hint">Phím 5</span><span class="label">Đã thuộc</span><span class="time">Ẩn luôn</span>
                </button>
            </div>
        </section>

        <section id="tab-mastered" class="tab-content">
            <div class="search-container">
                <input type="text" id="search-mastered" class="search-input" oninput="filterList('mastered')" placeholder="🔍 Tìm kiếm chữ Hán, pinyin hoặc nghĩa...">
            </div>
            <div id="mastered-grid" class="grid-container"></div>
        </section>
    </main>

    <!-- Modal Sửa Từ -->
    <div id="edit-modal" class="modal">
        <div class="modal-content form-container">
            <h3>Sửa Từ Vựng</h3>
            <input type="hidden" id="edit-id">
            <div class="input-group">
                <label>Chữ Hán:</label>
                <input type="text" id="edit-hanzi" required>
            </div>
            <div class="input-group">
                <label>Pinyin:</label>
                <input type="text" id="edit-pinyin" required>
            </div>
            <div class="input-group">
                <label>Từ loại:</label>
                <input type="text" id="edit-type" list="pos-options">
            </div>
            <div class="input-group">
                <label>English:</label>
                <textarea id="edit-en"></textarea>
            </div>
            <div class="input-group">
                <label>Tiếng Việt:</label>
                <textarea id="edit-vi" required></textarea>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveEditWord()" class="btn-success" style="flex: 1;">Lưu</button>
                <button onclick="closeEditModal()" class="btn-danger" style="flex: 1;">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Modal Cài Đặt -->
    <div id="settings-modal" class="modal">
        <div class="modal-content form-container">
            <h3>Cài Đặt Hệ Thống</h3>
            <div class="input-group">
                <label>Tốc độ đọc: <span id="speed-display" style="color: #4285f4; font-weight: bold;">0.8x</span></label>
                <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.1" value="0.8" style="width: 100%; margin: 15px 0;" oninput="document.getElementById('speed-display').innerText = this.value + 'x'">
            </div>
            <div style="text-align: center; margin-bottom: 25px;">
                <button type="button" onclick="testAudioSettings()" style="padding: 10px 20px; background: #ffc107; color: #333; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    <i class="fas fa-volume-up"></i> Nghe thử giọng đọc
                </button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="saveSettings()" class="btn-success" style="flex: 1;">Lưu</button>
                <button onclick="closeSettingsModal()" class="btn-danger" style="flex: 1;">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
