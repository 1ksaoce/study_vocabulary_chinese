<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Chống tự động phóng to màn hình khi ấn vào ô nhập liệu trên điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Từ Vựng Tiếng Trung</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bổ sung CSS cho tính năng Tìm kiếm và Modal Sửa từ -->
    <style>
        .search-container { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ced4da; font-size: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .action-icon { color: #6c757d; border: none; background: none; cursor: pointer; font-size: 16px; padding: 5px; }
        .action-icon:hover { color: #2c3e50; }
        .action-icon.delete:hover { color: #ea4335; }
        .action-icon.edit:hover { color: #17a2b8; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <button class="nav-btn active" onclick="switchTab('list')"><i class="fas fa-list"></i> Danh sách</button>
            <button class="nav-btn" onclick="switchTab('add')"><i class="fas fa-plus"></i> Thêm từ</button>
            <button class="nav-btn" onclick="switchTab('review')"><i class="fas fa-gamepad"></i> Ôn tập</button>
            <button class="nav-btn" onclick="switchTab('mastered')"><i class="fas fa-archive"></i> Đã ẩn</button>
        </div>
    </header>

    <main>
        <!-- Tab Danh sách -->
        <section id="tab-list" class="tab-content active">
            <div class="search-container">
                <input type="text" id="search-list" class="search-input" oninput="filterList('list')" placeholder="🔍 Tìm kiếm chữ Hán, pinyin hoặc nghĩa...">
            </div>
            <div id="flashcard-grid" class="grid-container"></div>
        </section>

        <!-- Tab Thêm từ -->
        <section id="tab-add" class="tab-content">
            <form id="add-word-form" class="form-container">
                <h2>Thêm Từ Mới</h2>
                <div class="input-group">
                    <label>Chữ Hán (Hanzi):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="input-hanzi" required placeholder="Nhập chữ Hán vào đây..." lang="zh-CN">
                        <button type="button" onclick="autoFill()" style="padding: 10px 15px; background-color: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: bold;">
                            <i class="fas fa-magic"></i> Điền tự động
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Phiên âm (Pinyin):</label>
                    <input type="text" id="input-pinyin" required placeholder="Sẽ tự động điền">
                </div>
                <div class="input-group">
                    <label>Loại từ:</label>
                    <select id="input-type">
                        <option value="Noun">Noun (Danh từ)</option>
                        <option value="Verb">Verb (Động từ)</option>
                        <option value="Adj">Adj (Tính từ)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>English Definition:</label>
                    <textarea id="input-en" placeholder="Nghĩa tiếng Anh tự động..." lang="en"></textarea>
                </div>
                <div class="input-group">
                    <label>Nghĩa tiếng Việt:</label>
                    <textarea id="input-vi" required placeholder="Nghĩa tiếng Việt tự động..." lang="vi"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Lưu từ mới</button>
            </form>
            
            <div class="form-container" style="margin-top: 25px; text-align: center; border: 2px dashed #ced4da;">
                <h3 style="margin-bottom: 10px; color: #495057;">Quản lý Dữ liệu JSON</h3>
                <div style="display: flex; justify-content: center; gap: 15px;">
                    <button onclick="exportJSON()" class="btn-success" style="padding: 10px 20px;"><i class="fas fa-download"></i> Xuất JSON</button>
                    <label class="btn-primary" style="padding: 10px 20px; cursor: pointer;">
                        <i class="fas fa-upload"></i> Nhập JSON
                        <input type="file" accept=".json" style="display: none;" onchange="importJSON(event)">
                    </label>
                </div>
            </div>
        </section>

        <!-- Tab Ôn tập -->
        <section id="tab-review" class="tab-content">
            <div id="review-container" class="review-card">
                <div class="empty-state">Nhấn "Bắt đầu ôn tập" để kiểm tra từ vựng.</div>
            </div>
            
            <div id="default-controls" class="review-controls">
                <button onclick="startReview()" class="btn-primary">Bắt đầu ôn tập</button>
            </div>

            <div id="srs-controls" class="srs-buttons" style="display: none;">
                <button class="btn-srs btn-srs-1" onclick="updateSRS(1)">
                    <span class="key-hint">Phím 1</span><span class="label">Lại</span><span class="time">30 phút</span>
                </button>
                <button class="btn-srs btn-srs-2" onclick="updateSRS(2)">
                    <span class="key-hint">Phím 2</span><span class="label">Khó</span><span class="time">1 ngày</span>
                </button>
                <button class="btn-srs btn-srs-3" onclick="updateSRS(3)">
                    <span class="key-hint">Phím 3</span><span class="label">Tốt</span><span class="time">4 ngày</span>
                </button>
                <button class="btn-srs btn-srs-4" onclick="updateSRS(4)">
                    <span class="key-hint">Phím 4</span><span class="label">Dễ</span><span class="time">6 ngày</span>
                </button>
                <button class="btn-srs btn-srs-5" onclick="updateSRS(5)">
                    <span class="key-hint">Phím 5</span><span class="label">Đã thuộc</span><span class="time">Ẩn luôn</span>
                </button>
            </div>
        </section>

        <!-- Tab Đã ẩn -->
        <section id="tab-mastered" class="tab-content">
            <div class="search-container">
                <input type="text" id="search-mastered" class="search-input" oninput="filterList('mastered')" placeholder="🔍 Tìm kiếm chữ Hán, pinyin hoặc nghĩa...">
            </div>
            <div id="mastered-grid" class="grid-container"></div>
        </section>
    </main>

    <!-- Modal Sửa Từ -->
    <div id="edit-modal" class="modal">
        <div class="modal-content form-container">
            <h3>Sửa Từ Vựng</h3>
            <input type="hidden" id="edit-id">
            <div class="input-group">
                <label>Chữ Hán:</label>
                <input type="text" id="edit-hanzi" required>
            </div>
            <div class="input-group">
                <label>Pinyin:</label>
                <input type="text" id="edit-pinyin" required>
            </div>
            <div class="input-group">
                <label>English:</label>
                <textarea id="edit-en"></textarea>
            </div>
            <div class="input-group">
                <label>Tiếng Việt:</label>
                <textarea id="edit-vi" required></textarea>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveEditWord()" class="btn-success" style="flex: 1;">Lưu thay đổi</button>
                <button onclick="closeEditModal()" class="btn-danger" style="flex: 1;">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
